<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./config.js" defer></script>
    <script src="./index.js" defer></script>
  </head>
  <body>
    <header class="header">
      <h1 class="header-title">Weather App</h1>
    </header>
    <div id="root">
      <main class="weather-app">
        <form class="search-form">
          <input
            type="text"
            class="city-input"
            name="city"
            placeholder="Enter city name"
            required
          />
          <button type="submit" class="search-button">Search</button>
        </form>

        <div class="loading hidden">Loading...</div>

        <div class="weather-result hidden">
          <div class="main-card">
            <div class="temperature">--°C</div>
            <div class="city-name">--</div>
            <img class="weather-icon" src="" alt="Weather icon" />
          </div>

          <div class="details">
            <div class="feels-card other-card">
              <div class="detail-title">Feels Like</div>
              <div class="feels-like">--°C</div>
            </div>

            <div class="other-card">
              <div class="detail-title">Humidity</div>
              <div class="humidity">--%</div>
            </div>

            <div class="other-card">
              <div class="detail-title">Wind Speed</div>
              <div class="wind">-- m/s</div>
            </div>

            <div class="other-card">
              <div class="detail-title">Description</div>
              <div class="description">--</div>
            </div>

          </div>
        </div>

        <div class="error-card hidden">
          <h2 class="error-title">Error</h2>
          <p class="error-message">--</p>
        </div>
      </main>
    </div>
  </body>
</html>
